# This is a Declarative Automation Bundle definition for init_gcp.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: init_gcp
  uuid: 46fb29ff-4e0e-4bfa-ad16-18bb533215d2

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: ctl_gcp
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/minh-cuong.doan@teamwork.net to make sure we only have a single copy.
      root_path: /Workspace/Users/minh-cuong.doan@teamwork.net/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ctl_gcp
      schema: prod
    permissions:
      - user_name: minh-cuong.doan@teamwork.net
        level: CAN_MANAGE
