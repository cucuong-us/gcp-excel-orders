# The main pipeline for init_gcp

resources:
  pipelines:
    init_gcp_etl:
      name: init_gcp_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/init_gcp_etl"

      libraries:
        - glob:
            include: ../src/init_gcp_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
